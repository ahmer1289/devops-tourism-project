    <main>
        <section class=hero>
            <h1>Contact Us</h1>
            <p>We'd love to hear from you! Fill out the form below or connect with us on social media.</p>
        </section>

        <section class=contact-section>
            <div class=contact-form-container>
                <form class=contact-form>
                    <label for=name>Name</label>
                    <input id=name name=name required>

                    <label for=email>Email</label>
                    <input type=email id=email name=email required>

                    <label for=message>Message</label>
                    <textarea id=message name=message rows=5 required></textarea>

                    <button>Send Message</button>
                </form>
            </div>
            <div class=social-media-links>
                <h2>Connect with us</h2>
                <a href=# title=Facebook class=social-link>Facebook</a> |
                <a href=# title=Twitter class=social-link>Twitter</a> |
                <a href=# title=Instagram class=social-link>Instagram</a>
            </div>
        </section>
    </main>
